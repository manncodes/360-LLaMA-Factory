# Comprehensive RoPE configuration with all available parameters
# For advanced long context extension with LLaMA 3.2 1B

### Model arguments (for ModelArguments)
model_name_or_path: unsloth/Llama-3.2-1B-Instruct
rope_scaling: dynamic  # Dynamic scaling for better adaptation
rope_theta: 2000000.0  # Very high theta for ultra-long context (2M)

### Data arguments (for DataArguments) 
dataset: alpaca_en_demo
template: llama3
cutoff_len: 16384  # 16k context to test extreme scaling
max_samples: 1     # Single sample for quick test
overwrite_cache: true
preprocessing_num_workers: 1

### Training arguments (for TrainingArguments)
stage: sft
do_train: true
finetuning_type: full
output_dir: comprehensive_rope_output
overwrite_output_dir: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 3.0e-5
num_train_epochs: 0.005
logging_steps: 1
save_steps: 1
save_total_limit: 1
warmup_steps: 0
optim: adamw_torch
fp16: false
bf16: true  # Use bf16 for efficiency with long contexts
max_steps: 1

### Generation arguments
do_sample: true
temperature: 0.8
top_p: 0.9
top_k: 40
max_new_tokens: 16

seed: 42

# Notes:
# - rope_theta: Higher values (2M vs 500k default) allow better long context
# - dynamic scaling: Adapts RoPE frequencies during training
# - 16k context: Tests extreme context extension capabilities
# - bf16: Required for memory efficiency with long contexts
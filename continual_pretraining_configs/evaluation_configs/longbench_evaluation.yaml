# LongBench Evaluation for Extended Context Models
# Comprehensive evaluation on long-context reasoning tasks

model_name_or_path: continual_pt_stage3_32k
template: llama3

# Evaluation task configuration
task: longbench
batch_size: 1
save_dir: longbench_32k_results

# LongBench specific parameters
longbench_max_examples: 100
longbench_domains: ["single_document_qa", "multi_document_qa", "summarization", "few_shot", "synthetic", "code"]
longbench_difficulty: "hard"
longbench_max_context_length: 32768
longbench_save_context: true

# Generation settings
longbench_temperature: 0.1
longbench_top_p: 1.0
longbench_top_k: 1
longbench_max_new_tokens: 256

# Advanced RoPE evaluation parameters
rope_scaling_type: longrope
rope_scaling_factor: 8.0
longrope_short_factor: [1.0, 1.5, 2.0]
longrope_long_factor: [1.0, 2.0, 4.0]

# Output configuration
output_dir: longbench_32k_evaluation
max_length: 32768
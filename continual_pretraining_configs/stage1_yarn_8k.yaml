# Stage 1: YaRN 4K -> 8K Context Extension
# Based on YaRN paper methodology for continual pretraining

# Model configuration
model_name_or_path: unsloth/Llama-3.2-1B-Instruct
template: llama3

# Advanced RoPE scaling (requires extended ModelArguments)
rope_scaling_type: yarn
rope_scaling_factor: 2.0
yarn_alpha: 1.0
yarn_beta: 32.0
rope_theta: 500000.0
original_max_position: 4096

# Training configuration
stage: pt
do_train: true
dataset: long_context_corpus
cutoff_len: 8192
max_samples: 5000

# Memory optimization for long context
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
gradient_checkpointing: true
bf16: true
dataloader_drop_last: true

# Learning schedule optimized for continual pretraining
learning_rate: 2e-5
num_train_epochs: 0.5
warmup_steps: 500
lr_scheduler_type: cosine
weight_decay: 0.01
max_grad_norm: 1.0

# Optimizer
optim: adamw_torch

# Logging and saving
output_dir: continual_pt_stage1_8k
overwrite_output_dir: true
logging_steps: 100
save_steps: 1000
save_total_limit: 2
report_to: none

# Evaluation during training
eval_strategy: steps
eval_steps: 500
do_eval: true

# Safety and debugging
seed: 42
remove_unused_columns: false
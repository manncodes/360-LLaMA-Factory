# RULER test with GPT-2 (small, fast model for testing)

### model
model_name_or_path: gpt2

### evaluation
task: ruler
ruler_tasks:
  - niah_single_1  # Simple needle retrieval
ruler_context_lengths:
  - 1024  # GPT-2 max context
ruler_num_samples: 2  # Just 2 samples for quick test
ruler_subset: validation
ruler_max_new_tokens: 20
ruler_batch_size: 1
ruler_save_predictions: true
output_dir: ./ruler_results/gpt2_test

### generation
temperature: 0.0
top_p: 1.0
do_sample: false

### device
device_map: auto
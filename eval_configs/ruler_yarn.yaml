# RULER evaluation with YARN RoPE scaling
# Test YARN (Yet Another RoPE extensioN) for extreme long contexts

### model
model_name_or_path: meta-llama/Llama-2-7b-hf

### evaluation  
task: ruler
ruler_tasks:
  - niah_single_1
  - niah_single_2
  - niah_multikey_1
  - niah_multivalue
  - vt
ruler_context_lengths:
  - 16384
  - 32768
  - 65536
  - 131072
ruler_num_samples: 10
ruler_subset: validation
ruler_max_new_tokens: 50
ruler_batch_size: 1
ruler_save_predictions: true
output_dir: ./ruler_results/yarn

### YARN RoPE scaling configuration
rope_scaling_type: yarn
rope_scaling_factor: 16.0
yarn_alpha: 1.0
yarn_beta: 32.0
max_length: 131072

### generation
temperature: 0.0
top_p: 1.0
do_sample: false

### device
device_map: auto
quantization_bit: 4
load_in_4bit: true
flash_attn: fa2  # Use FlashAttention-2 for efficiency
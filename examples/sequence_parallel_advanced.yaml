### Model Configuration
model_name_or_path: meta-llama/Meta-Llama-3-72B-Instruct

### Method Configuration  
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_offload_config.json

### Sequence Parallelism Configuration
# Number of GPUs to use for processing one sequence (must be divisor of total GPU count)
sequence_parallel_size: 8
# Sequence parallel mode - zigzag-ring is default and most stable
sequence_parallel_mode: zigzag-ring
# Extended sequence length for long-context training
cutoff_len: 210000

### Memory Optimization
# Enable gradient checkpointing to reduce memory usage
gradient_checkpointing: true
# Use FlashAttention-2 for optimal memory efficiency with sequence parallelism  
flash_attn: fa2
# Enable efficient packing
packing: true

### Dataset Configuration
dataset: identity,alpaca_en_demo
template: llama3
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 32

### Output Configuration
output_dir: saves/llama3-72b/full/sft-sp-advanced
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
report_to: tensorboard

### Training Configuration
per_device_train_batch_size: 1
gradient_accumulation_steps: 1  # Adjust based on effective batch size needed
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
seed: 42

### Advanced Optimization Settings
# Enable Liger kernel for additional memory savings (optional)
enable_liger_kernel: false
# Disable upcast for layernorm to save memory
upcast_layernorm: false

### Evaluation Configuration
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
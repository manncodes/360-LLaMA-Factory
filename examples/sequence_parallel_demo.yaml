### Model Configuration
model_name_or_path: meta-llama/Meta-Llama-3-8B-Instruct

### Method Configuration
stage: sft
do_train: true
finetuning_type: full  # or lora
deepspeed: examples/deepspeed/ds_z3_offload_config.json

### Sequence Parallelism Configuration
# Number of GPUs to use for processing one sequence (enables sequence parallelism when > 1)
sequence_parallel_size: 4
# Mode of sequence parallel implementation: "zigzag-ring" (default), "ulysses", or "llama3"
sequence_parallel_mode: zigzag-ring
# Sequence length for training (should match your data's maximum length)
cutoff_len: 128000

### Dataset Configuration
dataset: identity,alpaca_en_demo
template: llama3
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
packing: true  # Enable packing for better efficiency with sequence parallelism

### Output Configuration
output_dir: saves/llama3-8b/full/sft-sp
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### Training Configuration
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
# Enable gradient checkpointing for memory efficiency
gradient_checkpointing: true
# Enable FlashAttention-2 for optimal performance with sequence parallelism
flash_attn: fa2

### Evaluation Configuration
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
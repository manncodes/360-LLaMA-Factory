### Model Configuration
model_name_or_path: meta-llama/Meta-Llama-3-8B-Instruct

### Method Configuration
stage: dpo
do_train: true
finetuning_type: lora  # DPO typically uses LoRA for efficiency
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid  # choices: [sigmoid (dpo), orpo, simpo]

### Sequence Parallelism Configuration
# Number of GPUs to use for processing one sequence (enables sequence parallelism when > 1)
sequence_parallel_size: 4
# Mode of sequence parallel implementation: "zigzag-ring" (default), "ulysses"
sequence_parallel_mode: zigzag-ring
# Sequence length for training (DPO often benefits from longer contexts)
cutoff_len: 84000

### Dataset Configuration
dataset: dpo_en_demo
template: llama3
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16

### Output Configuration
output_dir: saves/llama3-8b/lora/dpo-sp
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### Training Configuration
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
# Enable gradient checkpointing for memory efficiency with long sequences
gradient_checkpointing: true
# Enable FlashAttention-2 for optimal performance with sequence parallelism
flash_attn: fa2

### Evaluation Configuration
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
### Model Configuration
model_name_or_path: meta-llama/Meta-Llama-3-8B-Instruct

### Method Configuration
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

### Sequence Parallelism Configuration - Ulysses Mode
# Number of GPUs to use for processing one sequence 
sequence_parallel_size: 4
# Ulysses mode - alternative to zigzag-ring, may have different performance characteristics
sequence_parallel_mode: ulysses
# Sequence length for training
cutoff_len: 128000

### Dataset Configuration
dataset: identity,alpaca_en_demo
template: llama3
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
packing: true

### Output Configuration
output_dir: saves/llama3-8b/lora/sft-ulysses
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### Training Configuration
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
# Enable gradient checkpointing for memory efficiency
gradient_checkpointing: true
# Enable FlashAttention-2 for optimal performance with sequence parallelism
flash_attn: fa2

### Evaluation Configuration
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
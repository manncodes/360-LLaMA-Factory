# Custom Split LLaMA Model SFT Example Configuration
# This demonstrates how to use the CustomSplitLLamaModel architecture

### model
model_name_or_path: meta-llama/Meta-Llama-3-8B-Instruct  # This will be ignored when using custom_split_llama
use_custom_split_llama: true
path8b: meta-llama/Meta-Llama-3-8B-Instruct  # Path to the 8B model
path70b: meta-llama/Meta-Llama-3-70B-Instruct  # Path to the 70B model
num_layers_8: 16  # Number of layers to use from 8B model
num_layers_70: 16  # Number of layers to use from 70B model
use_mlp_adapter: false  # Use linear adapter (set to true for MLP adapter)

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.1

### dataset
dataset: alpaca_en_demo
template: llama3
cutoff_len: 1024
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/custom_split_llama_sft
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 250
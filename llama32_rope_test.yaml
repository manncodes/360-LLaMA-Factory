# Test YAML for LLaMA 3.2 1B with RoPE scaling
# Conservative settings to avoid OOM

### Model arguments (for ModelArguments)
model_name_or_path: unsloth/Llama-3.2-1B-Instruct  # Unsloth LLaMA 3.2 1B
rope_scaling: linear  # Linear RoPE scaling
rope_theta: 500000.0  # RoPE theta frequency base (default for LLaMA 3.2: 500k)

### Data arguments (for DataArguments)
dataset: alpaca_en_demo
template: llama3
cutoff_len: 4096  # Extended context to trigger RoPE scaling
max_samples: 3    # Very small for quick test
overwrite_cache: true
preprocessing_num_workers: 1

### Training arguments (for TrainingArguments)
stage: sft
do_train: true
finetuning_type: full
output_dir: llama32_rope_output
overwrite_output_dir: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 5.0e-5
num_train_epochs: 0.01
logging_steps: 1
save_steps: 2
save_total_limit: 1
warmup_steps: 0
optim: adamw_torch
fp16: false
bf16: false
max_steps: 2  # Just 2 steps for quick test

### Generation arguments
do_sample: true
temperature: 0.95
top_p: 0.7
top_k: 50
max_new_tokens: 64

seed: 42
# LongBench v2 Standard Evaluation Configuration
# Standard mode evaluation with full dataset

model_name_or_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
finetuning_type: full
task: longbench_standard
save_dir: saves/longbench_standard_eval
template: alpaca
batch_size: 1

# LongBench specific settings
longbench_mode: standard
longbench_max_length: 131072  # 128k tokens
longbench_temperature: 0.1
longbench_max_new_tokens: 128

# Evaluate all 503 samples
# longbench_max_samples: null

# Evaluate all domains
# longbench_domains: null
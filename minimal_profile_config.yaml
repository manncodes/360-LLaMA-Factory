# Minimal config for profiling - no checkpoint saving overhead
model_name_or_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0

stage: sft
finetuning_type: full

dataset: alpaca_gpt4_en
template: alpaca

output_dir: saves/profile_temp
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_steps: 0
bf16: false
max_steps: 50

# Minimal logging to reduce overhead
logging_steps: 5
save_steps: 1000  # Don't save during profiling
eval_steps: 1000  # Don't eval during profiling
save_total_limit: 0  # Don't keep checkpoints
### model
model_name_or_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0

### No RoPE scaling (baseline)
rope_scaling: none
cutoff_len: 2048  # Default context length

### method
finetuning_type: full

### dataset
task: needle_haystack_proper
task_dir: evaluation
template: llama3
lang: en

### output
save_dir: saves/tinyllama/needle_haystack_baseline

### eval
batch_size: 1

### needle haystack configuration
needle_context_lengths: [512, 1024, 1536, 2048]  # Standard context lengths
needle_depth_percents: [0, 25, 50, 75, 100]    # Needle positions as percentages
needle_text: "The secret key is 42 alpha bravo."  # Text to find in context
needle_question: "What is the secret key?"      # Question about the needle
needle_haystack_data_source: "paulgraham"       # Use Paul Graham essays for realistic text

### optimization
flash_attn: auto
use_cache: true
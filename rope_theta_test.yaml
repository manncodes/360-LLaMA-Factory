# Test YAML for LLaMA 3.2 1B with custom rope_theta
# Testing different rope_theta values for context extension

### Model arguments (for ModelArguments)
model_name_or_path: unsloth/Llama-3.2-1B-Instruct  # Unsloth LLaMA 3.2 1B
rope_scaling: linear  # Linear RoPE scaling
rope_theta: 1000000.0  # Higher theta for better long context (1M vs default 500k)

### Data arguments (for DataArguments)
dataset: alpaca_en_demo
template: llama3
cutoff_len: 8192  # Extended context to test rope_theta impact
max_samples: 2    # Small for quick test
overwrite_cache: true
preprocessing_num_workers: 1

### Training arguments (for TrainingArguments)
stage: sft
do_train: true
finetuning_type: full
output_dir: rope_theta_output
overwrite_output_dir: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 5.0e-5
num_train_epochs: 0.01
logging_steps: 1
save_steps: 1
save_total_limit: 1
warmup_steps: 0
optim: adamw_torch
fp16: false
bf16: true
max_steps: 1  # Just 1 step to test loading

### Generation arguments
do_sample: true
temperature: 0.95
top_p: 0.7
top_k: 50
max_new_tokens: 32

seed: 42
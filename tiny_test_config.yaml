# Ultra-minimal config for quick testing
model_name_or_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0

stage: sft
finetuning_type: full

dataset: identity
template: alpaca
cutoff_len: 128  # Very short sequences

output_dir: saves/tiny_test
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
lr_scheduler_type: constant
warmup_steps: 0
bf16: false
max_steps: 5

# Disable everything else
logging_steps: 100
save_steps: 1000
eval_steps: 1000
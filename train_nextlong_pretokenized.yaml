# Example configuration for training with pretokenized NExtLong-512K dataset
# This config demonstrates how to use pretokenized data for fast training startup

# Model configuration
model_name_or_path: meta-llama/Llama-2-7b-hf
template: default

# IMPORTANT: Use pretokenized dataset for fast loading
# First run: python pretokenize_dataset.py --dataset caskcsg/NExtLong-512K-dataset --model meta-llama/Llama-2-7b-hf --cutoff 524288 --output ./tokenized_data/nextlong_512k
tokenized_path: ./tokenized_data/nextlong_512k

# Training stage
stage: pt
do_train: true

# CRITICAL: This must match the cutoff used during pretokenization
cutoff_len: 524288

# Memory optimization for 512K context
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
bf16: true

# Training configuration
learning_rate: 5e-6
num_train_epochs: 1
warmup_steps: 100
lr_scheduler_type: cosine
weight_decay: 0.01
max_grad_norm: 1.0

# Optimizer
optim: adamw_torch

# Output and logging
output_dir: ./outputs/nextlong_512k_pretokenized
overwrite_output_dir: true
logging_steps: 10
save_steps: 100
save_total_limit: 3

# Evaluation
do_eval: true
eval_strategy: steps
eval_steps: 50
per_device_eval_batch_size: 1

# Performance optimization
dataloader_num_workers: 4
remove_unused_columns: false
ddp_timeout: 3600000  # Increase timeout for long contexts

# RoPE configuration for long context (optional)
# Uncomment if you want to extend context further
# rope_scaling_type: linear
# rope_scaling_factor: 128.0  # 4K base * 128 = 512K